name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check the tag matches the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"

      - name: Smoke test
        run: |
          npm run build
          node dist/main.js generate --icon sneaker-move --color '#5E5CE6' --output "$RUNNER_TEMP/Smoke.icon"
          test -f "$RUNNER_TEMP/Smoke.icon/icon.json"

      - name: Publish with trusted publishing
        run: npm publish --access public
